<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            margin-top: 30px;
        }

        #game {
            width: 300px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .cell {
            width: 95px;
            height: 95px;
            background: white;
            border: 2px solid #333;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: #e8e8e8;
        }

        #message {
            font-size: 22px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div id="message">Player X's Turn</div>

    <div id="game">
        <div class="cell" onclick="play(0)"></div>
        <div class="cell" onclick="play(1)"></div>
        <div class="cell" onclick="play(2)"></div>
        <div class="cell" onclick="play(3)"></div>
        <div class="cell" onclick="play(4)"></div>
        <div class="cell" onclick="play(5)"></div>
        <div class="cell" onclick="play(6)"></div>
        <div class="cell" onclick="play(7)"></div>
        <div class="cell" onclick="play(8)"></div>
    </div>

    <button onclick="restart()">Restart Game</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let player = "X";
        let gameOver = false;

        const cells = document.querySelectorAll(".cell");
        const message = document.getElementById("message");

        function play(index) {

            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = player;
            cells[index].innerHTML = player;

            checkWinner();

            if (!gameOver) {
                player = player === "X" ? "O" : "X";
                message.innerHTML = "Player " + player + "'s Turn";
            }
        }

        function checkWinner() {

            let winningPatterns = [
                [0,1,2],
                [3,4,5],
                [6,7,8],
                [0,3,6],
                [1,4,7],
                [2,5,8],
                [0,4,8],
                [2,4,6]
            ];

            for (let pattern of winningPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]) {

                    message.innerHTML = "🎉 Player " + player + " Wins!";
                    gameOver = true;
                    return;
                }
            }

            if (!board.includes("")) {
                message.innerHTML = "🤝 Game Draw!";
                gameOver = true;
            }
        }

        function restart() {

            board = ["", "", "", "", "", "", "", "", ""];
            player = "X";
            gameOver = false;

            cells.forEach(cell => {
                cell.innerHTML = "";
            });

            message.innerHTML = "Player X's Turn";
        }
    </script>

</body>
</html>
